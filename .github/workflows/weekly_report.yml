name: Weekly Job Aggregator

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas fpdf2 python-dotenv urllib3

    - name: Run Job Aggregator
      env:
        EMAIL: ${{ secrets.EMAIL }}
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
      run: |
        python job_aggregator.py