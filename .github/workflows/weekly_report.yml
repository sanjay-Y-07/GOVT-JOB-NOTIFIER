name: Weekly Job Aggregator

on:
  schedule:
    # Runs at 3:30 AM UTC every Sunday (which is exactly 9:00 AM IST)
    - cron: '30 3 * * 0'
  workflow_dispatch: # Allows you to manually trigger a test run

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas fpdf2 python-dotenv

    - name: Run Job Aggregator
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      run: |
        python job_aggregator.py
    - name: Run Job Aggregator
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
      run: |
        python job_aggregator.py    